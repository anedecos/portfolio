const lang0 = () => { const q = new URLSearchParams(location.search).get('lang'); if (q === 'es' || q === 'en') return q; try { return localStorage.getItem('portfolio-lang') === 'es' ? 'es' : 'en' } catch { return 'en' } };
const pair = t => typeof t === 'string' ? [t, t] : t;
function el(tag, cls, text, attrs = {}) {
 const node = document.createElement(tag);
 if (cls) node.className = cls;
 if (text != null) { const [en, es] = pair(text); node.dataset.en = en; node.dataset.es = es; node.textContent = en }
 Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
 return node;
}
const list = items => { const ul = el('ul'); items.forEach(i => ul.append(el('li', '', i))); return ul };

function renderStage(s, i) {
 const article = el('article', 'stage' + (s.current ? ' current' : ''), null, {id: s.id});
 const main = el('div');
 const head = el('div', 'stage-head');
 head.append(el('span', 'verb', s.verb), el('span', 'eyebrow', s.dates));
 main.append(head, el('h2', '', s.title));
 const who = el('div');
 who.append(el('span', 'company', s.company), document.createTextNode(' · '), el('span', 'role', s.role));
 main.append(who, el('p', 'summary', s.summary));
 if (s.groups) {
  const groups = el('div', 'groups');
  s.groups.forEach(g => {
   const box = el('div', 'group' + (g.wide ? ' wide' : ''));
   box.append(el('h3', '', g.label));
   if (g.stack) {
    const dl = el('dl', 'stack');
    g.stack.forEach(([label, chips]) => { const dd = el('dd'); chips.forEach(c => dd.append(el('span', 'chip', c))); dl.append(el('dt', '', label), dd) });
    box.append(dl);
   } else box.append(list(g.items));
   groups.append(box);
  });
  main.append(groups);
 }
 if (s.projects) {
  const wrap = el('div', 'group wide');
  wrap.style.marginTop = '16px';
  wrap.append(el('h3', '', ['Key projects', 'Proyectos clave']));
  const grid = el('div', 'projects');
  s.projects.forEach((p, n) => {
   const card = el('div', 'project');
   card.append(el('span', 'num', '0' + (n + 1)), el('strong', '', p.name), el('p', '', p.text));
   if (p.metric) card.append(el('span', 'metric', p.metric));
   grid.append(card);
  });
  wrap.append(grid);
  main.append(wrap);
 }
 const notes = el('aside', 'notes', null, {'aria-label': 'Notes'});
 if (s.remember) {
  const r = el('div', 'note remember');
  r.append(el('h3', '', ['Remember', 'Para recordar']), el('p', 'mnemonic', s.remember.line));
  const ul = el('ul');
  s.remember.keys.forEach(([en, es]) => { const li = el('li'); li.append(el('b', '', [en[0], es[0]]), document.createTextNode(' · '), el('span', '', [en[1], es[1]])); ul.append(li) });
  r.append(ul);
  notes.append(r);
 }
 if (s.asked) {
  const a = el('div', 'note asked');
  a.append(el('h3', '', ['If they ask', 'Si me preguntan']));
  s.asked.forEach(x => { const qa = el('div', 'qa'); qa.append(el('p', 'q', x.q), el('p', 'a', x.a)); a.append(qa) });
  notes.append(a);
 }
 if (s.pending) {
  const p = el('div', 'note pending');
  p.append(el('span', 'eyebrow', ['In progress', 'En construcción']), el('span', '', ['Notes for this stage are coming.', 'Las notas de esta etapa vienen en camino.']));
  notes.append(p);
 }
 article.append(main, notes);
 return article;
}

const thread = document.getElementById('thread');
STAGES.forEach((s, i) => {
 const a = el('a', '', null, {href: '#' + s.id});
 a.append(el('span', 'arrow', '0' + (i + 1) + (i < STAGES.length - 1 ? ' →' : '')), el('strong', '', s.verb), el('span', '', s.title));
 thread.append(a);
 document.getElementById('timeline').append(renderStage(s, i));
});

const menu = document.querySelector('.menu-button');
const nav = document.getElementById('navigation');
const closeMenu = () => { nav.classList.remove('open'); menu.setAttribute('aria-expanded', 'false') };
menu.addEventListener('click', () => { const open = menu.getAttribute('aria-expanded') !== 'true'; menu.setAttribute('aria-expanded', String(open)); nav.classList.toggle('open', open) });
nav.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav.classList.contains('open')) { closeMenu(); menu.focus() } });
matchMedia('(min-width:701px)').addEventListener('change', closeMenu);
function setLanguage(value) {
 const lang = value === 'es' ? 'es' : 'en';
 document.documentElement.lang = lang;
 document.querySelectorAll('[data-en]').forEach(node => node.textContent = node.dataset[lang]);
 document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
 nav.setAttribute('aria-label', lang === 'es' ? 'Navegación principal' : 'Main navigation');
 thread.setAttribute('aria-label', lang === 'es' ? 'Etapas' : 'Stages');
 document.querySelectorAll('.notes').forEach(n => n.setAttribute('aria-label', lang === 'es' ? 'Notas' : 'Notes'));
 document.querySelector('.brand').setAttribute('aria-label', lang === 'es' ? 'ANEDECOS, inicio' : 'ANEDECOS, home');
 document.title = lang === 'es' ? 'Trayectoria | Andrés Echeverry | ANEDECOS' : 'Journey | Andrés Echeverry | ANEDECOS';
 try { localStorage.setItem('portfolio-lang', lang) } catch {}
}
setLanguage(lang0());
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
